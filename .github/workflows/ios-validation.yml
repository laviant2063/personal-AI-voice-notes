name: iOS validation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-validation
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out audited source and submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: false
          persist-credentials: false

      - name: Verify Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          python3 - <<'PY'
          import re
          import subprocess
          version = subprocess.check_output(["xcodebuild", "-version"], text=True).splitlines()[0]
          match = re.search(r"(\d+)\.(\d+)", version)
          if not match or tuple(map(int, match.groups())) < (16, 3):
              raise SystemExit("Xcode 16.3 or newer is required")
          PY

      - name: Ensure CMake is available
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          cmake --version

      - name: Build pinned whisper XCFramework
        shell: bash
        run: ./build-whisper-xcframework.sh

      - name: Run portable core tests
        shell: bash
        run: swift test

      - name: Build iOS simulator app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WalkWrite.xcodeproj \
            -scheme WalkWrite \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          devices_json="$(mktemp)"
          xcrun simctl list devices available -j > "$devices_json"
          device_id="$(python3 - "$devices_json" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcodebuild \
            -project WalkWrite.xcodeproj \
            -scheme WalkWrite \
            -destination "platform=iOS Simulator,id=$device_id" \
            -only-testing:WalkWriteTests \
            CODE_SIGNING_ALLOWED=NO \
            test
